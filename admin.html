<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vertex Theory Admin</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh}.admin-shell{max-width:1180px;margin:auto;padding:25px 18px}.admin-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:20px}.admin-grid{display:grid;grid-template-columns:190px 1fr;gap:25px}.tabs{display:grid;align-content:start;gap:6px}.tabs button{background:none;border:1px solid transparent;text-align:left;padding:11px;cursor:pointer}.tabs button.active{border-color:var(--line);background:var(--paper);font-weight:700}.panel{background:var(--paper);border:1px solid var(--line);padding:22px}.field{display:grid;gap:6px;margin-bottom:15px}.field label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.field input,.field textarea,.field select{border:1px solid var(--line);background:white;padding:11px;width:100%}.field textarea{min-height:260px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.post-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.login{max-width:430px;margin:10vh auto;padding:25px;background:var(--paper);border:1px solid var(--line)}.danger{background:#7d211b}.hidden{display:none!important}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.admin-top{align-items:flex-start;gap:10px}.post-row{display:grid}}
</style></head><body><div class="admin-shell"><div id="loginView" class="login"><div class="kicker">Vertex Theory</div><h1 style="font-family:'Libre Baskerville',serif">Admin</h1><p class="meta">Sign in with the Firebase Auth account designated as the site administrator.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="button">Sign in</button></form><p id="loginError" class="error hidden"></p></div><div id="adminView" class="hidden"><div class="admin-top"><div><div class="kicker">Control room</div><h1 style="font-family:'Libre Baskerville',serif;margin:3px 0">Vertex Theory</h1><div class="meta" id="who"></div></div><button class="button" id="logout">Sign out</button></div><div class="admin-grid"><aside class="tabs"><button data-tab="posts" class="active">Posts</button><button data-tab="editor">Post editor</button><button data-tab="appearance">Appearance</button><button data-tab="subscribers">Subscribers</button><button data-tab="comments">Comments</button></aside><main><section id="tab-posts" class="panel tab"><h2>Posts</h2><button class="button" id="newPost">+ New post</button><div id="postList"></div></section><section id="tab-editor" class="panel tab hidden"><h2 id="editorTitle">New post</h2><form id="postForm"><input id="postId" type="hidden"><div class="field"><label>Title</label><input id="postTitle" required></div><div class="two"><div class="field"><label>Category</label><input id="postCategory" placeholder="Type any category you want" required></div><div class="field"><label>Status</label><select id="postStatus"><option value="draft">Draft</option><option value="published">Published</option></select></div></div><div class="field"><label>Slug</label><input id="postSlug" placeholder="my-article-title" required></div><div class="field"><label>Excerpt</label><textarea id="postExcerpt" style="min-height:100px"></textarea></div><div class="field"><label>Thumbnail / hero image URL</label><input id="postImage" placeholder="https://... or Imgur share URL"></div><div class="two"><div class="field"><label>Author</label><input id="postAuthor" value="Vertex Theory"></div><div class="field"><label>Read time</label><input id="postReadTime" value="5 min read"></div></div><div class="field"><label>Tags (comma separated)</label><input id="postTags"></div><div class="field"><label>Body HTML</label><textarea id="postBody" placeholder="Write HTML here. Example: <p>Your article...</p><p><a href='https://example.com'>Affiliate link</a></p>"></textarea></div><button class="button">Save post</button> <button type="button" class="button danger hidden" id="deletePost">Delete</button></form></section><section id="tab-appearance" class="panel tab hidden"><h2>Appearance</h2><form id="appearanceForm"><div class="field"><label>Site title</label><input id="siteTitle"></div><div class="field"><label>Description</label><textarea id="siteDescription" style="min-height:120px"></textarea></div><div class="two"><div class="field"><label>Accent color</label><input id="accent" type="color"></div><div class="field"><label>Secondary color</label><input id="accent2" type="color"></div></div><button class="button">Save appearance</button></form></section><section id="tab-subscribers" class="panel tab hidden"><h2>Subscribers</h2><div id="subscriberList"></div></section><section id="tab-comments" class="panel tab hidden"><h2>Comments</h2><p class="meta">Approve or remove comments before they appear publicly.</p><div id="commentList"></div></section></main></div></div></div><div class="toast" id="toast"></div><script type="module" src="admin.js"></script></body></html>
